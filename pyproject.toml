[project]
name = "mybudongsan"
version = "0.1.0"
description = "Evidence-backed apartment purchase research for personal Codex workflows"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "jinja2>=3.1",
  "keyring>=25",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
mybudongsan = "mybudongsan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mybudongsan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires user credentials and live websites"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mybudongsan"]
